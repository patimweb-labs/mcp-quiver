[package]
name = "quiver-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "mcp-quiver: Server — Bibliothek, Zuweisung, Verteilung, Admin-API"

[lib]
name = "quiver_server"
path = "src/lib.rs"

[[bin]]
name = "quiver-server"
path = "src/main.rs"

[dependencies]
quiver-domain.workspace = true
quiver-protocol.workspace = true
quiver-bibliothek.workspace = true
anyhow.workspace = true
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
futures-util = "0.3"
hex.workspace = true
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[dev-dependencies]
http-body-util = "0.1"
rsa = "0.9"
rand08 = { package = "rand", version = "0.8" }
tower = { version = "0.5", features = ["util"] }
