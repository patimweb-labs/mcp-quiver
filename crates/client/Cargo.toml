[package]
name = "quiver-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "mcp-quiver: Client-Kern — Abgleich, Laufzeiten, MCP-Endpunkt für Agenten"

[[bin]]
name = "quiver-echo-mcp"
path = "src/bin/quiver-echo-mcp.rs"

[[bin]]
name = "quiver-demo-mcp"
path = "src/bin/quiver-demo-mcp.rs"

[[bin]]
name = "quiver-anmelde-attrappe"
path = "src/bin/quiver-anmelde-attrappe.rs"

[dependencies]
# Systembrowser ohne Shell (Anmeldung am Server).
open = "5"
quiver-domain.workspace = true
quiver-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
axum = "0.8"
dirs = "6"
futures-util = "0.3"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.9"
# Schlüssel für die verschlüsselte Sicherung der Einstellungen (Aufgabe 15).
argon2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "3.11", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    # Ohne dieses Feature baut rmcp sein reqwest ohne TLS: entfernte
    # MCP-Server über https scheitern dann mit „error sending request“.
    "reqwest",
] }


# Vorgaben der Firma lesen (Aufgabe 34): `HKLM\Software\Policies\mcp-quiver`.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
quiver-server = { path = "../server" }
# Entra-Nachbau im Ende-zu-Ende-Test (wie crates/server/tests/entra.rs):
# eigener RSA-Schlüssel auf Loopback, kein echter Mandant.
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = "0.10"
# Zufall für den Prüfschlüssel des Entra-Nachbaus (rsa 0.10 nimmt rand_core 0.10).
getrandom = "0.4"
url = "2"
