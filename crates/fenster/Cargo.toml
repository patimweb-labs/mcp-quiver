[package]
name = "quiver-fenster"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "mcp-quiver: Client-Fenster (egui)"

[[bin]]
name = "quiver"
path = "src/main.rs"

[dependencies]
quiver-client.workspace = true
quiver-domain.workspace = true
quiver-protocol.workspace = true
quiver-oberflaeche.workspace = true
# `clipboard` ist zusätzlich zu den in der Aufgabe genannten Merkmalen dabei:
# ohne es landet „Kopieren" (Endpunkt, Token, Schnipsel) nicht in der
# Zwischenablage des Systems.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "accesskit",
    "clipboard",
    "wayland",
    "x11",
] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
