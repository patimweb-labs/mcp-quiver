[package]
name = "quiver-fenster"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "mcp-quiver: Client-Fenster (egui)"

[[bin]]
name = "quiver"
path = "src/main.rs"

[dependencies]
quiver-client.workspace = true
quiver-domain.workspace = true
quiver-protocol.workspace = true
quiver-oberflaeche.workspace = true
# `clipboard` ist zusätzlich zu den in der Aufgabe genannten Merkmalen dabei:
# ohne es landet „Kopieren" (Endpunkt, Token, Schnipsel) nicht in der
# Zwischenablage des Systems.
# „links": ohne es führt egui-winit `ctx.open_url` nicht aus – der Hilfe-Link
# neben Feldern („Token in Outline erstellen") öffnete dann keinen Browser.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "accesskit",
    "clipboard",
    "links",
    "wayland",
    "x11",
] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# Tray-Symbol: das Lucide-Zeichen `package` in 32 und 64 px rastern. Liegt
# über `egui_extras` (SVG-Icons) ohnehin schon im Baum.
resvg = "0.45"
# Datei-Dialoge für Export und Import der Einstellungen (Aufgabe 15): reines
# Rust, ohne Bindung an die Werkzeuge einer Plattform.
rfd = "0.18"

# Menüleiste (macOS) und Infobereich (Windows).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

# StatusNotifierItem (KDE, GNOME mit AppIndicator, Xfce …).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

# Autostart-Eintrag unter `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
