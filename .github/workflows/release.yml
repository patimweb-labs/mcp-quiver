# Client-Pakete für macOS (arm64 + Intel), Windows und Linux (x86_64 +
# aarch64), dazu ein GitHub-Release mit Prüfsummen und Herkunftsnachweis.
#
#   Merge eines Release-PR  -> release-please legt Tag und Release an, danach
#                              wird im **selben** Lauf gebaut und angehängt
#   Tag vX.Y.Z (von Hand)   -> bauen, Release anlegen (oder ergänzen), anhängen
#   Push nach main ohne
#   neues Release           -> nur der Release-PR wird geführt, nichts gebaut
#   „Run workflow“          -> nur bauen, Pakete liegen als Artefakte am Lauf
#   Pull Request            -> nur bauen, wenn Pipelines oder Paket-Skripte sich
#                              ändern (kein Release, keine Geheimnisse)
#
# Warum Tag und Bau in einem Lauf: Ein Tag, den `GITHUB_TOKEN` anlegt, löst
# **keine** weiteren Workflows aus. release-please erzeugt den Tag hier, also
# muss dieser Lauf auch bauen und veröffentlichen. Der Weg „Tag von Hand“
# bleibt daneben bestehen; er löst den Lauf direkt aus.
#
# Das Server-Abbild baut weiterhin `abbild.yml`. Weil ein Tag von
# `GITHUB_TOKEN` auch dort keinen Lauf auslöst, stößt der Job `abbild` den
# Workflow nach einem von release-please erzeugten Tag ausdrücklich an
# (`workflow_dispatch` ist die Ausnahme von dieser Regel). Bei einem Tag von
# Hand löst der Tag selbst `abbild.yml` aus.
#
# Was hier gebaut wird, steht in `verteilung/` und läuft auch lokal:
#   verteilung/macos/paket.sh      .app + .dmg (ad hoc oder signiert/notarisiert)
#   verteilung/linux/paket.sh      .tar.gz, .deb, .rpm, AppImage
#   verteilung/windows/paket.ps1   .msi (je Benutzer) + portables .zip
#
# In jedem Paket stecken die Werkzeuge aus `patimweb-labs/quiver-tools`
# (Aufgabe 35) — gebaut auf demselben Läufer aus dem Commit, der in
# `verteilung/tools/stand.txt` festgelegt ist. Ein Eintrag der Bibliothek nennt
# dann nur noch den Programmnamen, und der Client findet ihn neben seinem
# eigenen Programm.
#
# **Unsigniert ist der Normalfall** (kein Apple-Konto, kein
# Windows-Zertifikat): macOS wird ad hoc signiert, Gatekeeper und SmartScreen
# fragen beim ersten Start. Sind die macOS-Geheimnisse gesetzt, wird signiert
# und notarisiert; was dabei herauskam, steht im Release-Text. Auf Pull
# Requests werden Geheimnisse **nicht** angefasst — dort läuft der Schritt
# ohne sie.
#
# Rechte: `permissions` ist überall leer, jeder Job nimmt sich nur, was er
# braucht (Lesen); schreiben darf allein der Release-Job.
#
# Bedingungen: In einem Job **ohne** Statusfunktion prüft GitHub stillschweigend
# `success()` über **alle** Vorfahren. Ein übersprungener Job (etwa
# `release_please` bei einem Tag von Hand, bei einem Pull Request oder bei
# „Run workflow“) würde damit `pakete`, `veroeffentlichen` und `abbild`
# mitreißen. Deshalb steht überall ausdrücklich `!cancelled() &&
# needs.<job>.result == 'success' && …`; `!cancelled()` statt `always()`, weil
# ein abgebrochener Lauf auch nicht weiterbauen soll.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "verteilung/**"
      - "assets/marke/**"
  workflow_dispatch:

# Zwei Läufe am selben Tag würden sich die Dateien am Release streitig machen.
# Nicht abbrechen: ein halb hochgeladenes Release ist schlimmer als ein spätes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # `aws-lc-sys` (TLS in reqwest/rustls) bräuchte unter Windows sonst NASM.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  # Hält den Release-PR aktuell und legt beim Merge des Release-PR den Tag und
  # das GitHub-Release an. Die Version steht in `release-please-config.json`
  # (Cargo.toml und Cargo.lock), die Historie in `.release-please-manifest.json`.
  release_please:
    name: Release-PR und Tag
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Der Tag muss die Version aus `[workspace.package]` tragen — sonst hieße das
  # Release anders als das Programm in seinem eigenen Protokoll.
  version:
    name: Version und Tag
    needs: release_please
    # `skipped` ist der Normalfall: bei einem Tag von Hand, einem Pull Request
    # und „Run workflow“ läuft release-please nicht.
    if: "!cancelled() && (needs.release_please.result == 'success' || needs.release_please.result == 'skipped')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      veroeffentlichen: ${{ steps.v.outputs.veroeffentlichen }}
      selbst_erzeugt: ${{ steps.v.outputs.selbst_erzeugt }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Version aus Cargo.toml gegen den Tag prüfen
        id: v
        env:
          EREIGNIS: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RP_RELEASED: ${{ needs.release_please.outputs.released }}
          RP_TAG: ${{ needs.release_please.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(verteilung/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          tag=""
          selbst_erzeugt=nein
          if [ "$EREIGNIS" = "push" ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            # Tag von Hand: dieser Lauf ist der Bau dazu.
            tag="$REF_NAME"
          elif [ "$EREIGNIS" = "push" ] && [ "${REF#refs/heads/}" != "$REF" ] && [ "$RP_RELEASED" = "true" ]; then
            # release-please hat in diesem Lauf Tag und Release angelegt.
            tag="$RP_TAG"
            selbst_erzeugt=ja
          fi

          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::Tag »$tag« passt nicht zu »v$version« aus Cargo.toml."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "selbst_erzeugt=$selbst_erzeugt" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "veroeffentlichen=ja" >> "$GITHUB_OUTPUT"
          else
            echo "veroeffentlichen=nein" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $version, Tag ${tag:-keiner}"

  # Nativ auf dem jeweiligen Läufer gebaut, kein Cross-Compile: Rust unter
  # Emulation braucht eine Stunde statt Minuten.
  #
  # `fail-fast: false`: ein gescheitertes Linux ist kein Grund, macOS nicht
  # zu bauen — so steht in einem Lauf da, **welche** Plattformen brechen. Der
  # Lauf bleibt rot, und weil `veroeffentlichen` `needs.pakete.result ==
  # 'success'` verlangt, wird dann nichts veröffentlicht.
  pakete:
    name: Paket ${{ matrix.name }}
    needs: version
    # Auf einem Push nach main ohne neues Release gibt es nichts zu bauen.
    # Gebaut wird auf jedem Weg, der Pakete liefern kann: Tag von Hand,
    # gemergter Release-PR, Pull Request und „Run workflow“.
    if: "!cancelled() && needs.version.result == 'success' && (needs.version.outputs.veroeffentlichen == 'ja' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, arch: arm64 }
          # Intel-Bündel auf einem Intel-Läufer; `macos-13` ist eingestellt.
          - { name: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { name: windows-x86_64, os: windows-2025, arch: x86_64 }
          # 22.04: ältere glibc (2.35) — die Programme laufen damit auch auf
          # älteren Systemen, nicht nur auf dem neuesten.
          - { name: linux-x86_64, os: ubuntu-22.04, arch: x86_64 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      # `file` und `libfuse2` braucht appimagetool; nfpm holt sich das Skript
      # selbst (feste Version, feste Prüfsumme).
      - name: Werkzeuge für die Pakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file libfuse2

      # Die Werkzeuge aus quiver-tools (Aufgabe 35): fester Commit aus
      # `verteilung/tools/stand.txt`, gestrippt, auf demselben Läufer gebaut
      # wie der Client. `herkunft.sh` nennt danach Version und Commit im
      # Release-Text.
      - name: Werkzeuge bauen (macOS, Linux)
        if: runner.os != 'Windows'
        run: verteilung/tools/bauen.sh

      - name: Werkzeuge bauen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verteilung/tools/bauen.ps1

      # Zwei Schritte statt einem: so wird auf Pull Requests **kein** Secret
      # ausgewertet, auch nicht als leerer Wert.
      - name: Paket bauen (macOS, mit Geheimnissen)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: verteilung/macos/paket.sh

      - name: Paket bauen (macOS, unsigniert)
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: verteilung/macos/paket.sh

      - name: Paket bauen (Linux)
        if: runner.os == 'Linux'
        run: verteilung/linux/paket.sh

      - name: Paket bauen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verteilung/windows/paket.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: paket-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/SIGNIERT.txt
            dist/*.msi
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            # Was in den Paketen steckt: Version, Commit, Größe der Werkzeuge.
            dist/TOOLS.txt

  # Der einzige Job mit Schreibrechten: Prüfsummen, Herkunftsnachweis, Release.
  veroeffentlichen:
    name: Prüfsummen und Release
    needs: [version, pakete]
    # Nur mit Tag **und** mit allen gebauten Paketen. Bei einem Pull Request
    # und bei „Run workflow“ setzt `version` `veroeffentlichen=nein`; hier wird
    # dann nichts angelegt und nichts hochgeladen.
    if: "!cancelled() && needs.version.result == 'success' && needs.pakete.result == 'success' && needs.version.outputs.veroeffentlichen == 'ja'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: paket-*
          path: aus

      - name: Pakete einsammeln
        run: |
          set -euo pipefail
          mkdir -p release
          find aus -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.zip' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "::error::Keine Pakete da — die Bau-Jobs sind gescheitert."
            exit 1
          fi
          ls -la release

      - name: Prüfsummen
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          # Die Größe jeder Datei für den Release-Text (Aufgabe 35: „Paket-
          # größe nennen“). Bewusst **außerhalb** von `release/`: sonst läge
          # die Tabelle als weiteres Release-Anhängsel ohne Prüfsumme daneben.
          {
            echo "| Datei | Größe |"
            echo "| --- | --- |"
            for datei in *; do
              printf "| %s | %s |\n" "$datei" "$(du -h --apparent-size "$datei" | cut -f1)"
            done
          } > ../groessen.md
          cat ../groessen.md

      # Herkunft: bescheinigt, dass diese Dateien in diesem Lauf aus diesem
      # Commit entstanden sind. Prüfen mit
      #   gh attestation verify <datei> --repo <repo>
      #
      # Über `SHA256SUMS` statt über Namensmuster: fällt eine Plattform aus,
      # steht ihre Datei nicht in der Liste, und der Job scheitert nicht an
      # einem Muster, das nichts trifft. Das Format der Datei ist genau das,
      # das der Schritt erwartet (Prüfsumme, zwei Leerzeichen, Name).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release/SHA256SUMS

      - name: Release-Text schreiben
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Was der macOS-Bau über seine Signatur gesagt hat (siehe
          # `verteilung/macos/paket.sh`): signiert-und-notarisiert, signiert
          # oder unsigniert.
          macos=$(cat aus/paket-macos-arm64/SIGNIERT.txt 2>/dev/null || echo unbekannt)

          # Die Werkzeuge im Paket (Aufgabe 35). Derselbe Stand auf allen
          # Plattformen, deshalb genügt ein Bericht; `verteilung/tools/bauen.sh`
          # schreibt ihn.
          bericht=$(find aus -name TOOLS.txt -print -quit)
          if [ -n "$bericht" ]; then
            tools_version=$(sed -n 's/^version=//p' "$bericht" | head -1)
            tools_commit=$(sed -n 's/^commit=//p' "$bericht" | head -1)
            tools_anzahl=$(sed -n 's/^anzahl=//p' "$bericht" | head -1)
            tools_kib=$(sed -n 's/^groesse_kib=//p' "$bericht" | head -1)
            tools_gestrippt=$(sed -n 's/^gestrippt=//p' "$bericht" | head -1)
          fi
          if [ "${tools_gestrippt:-nein}" = ja ]; then
            tools_strip=", gestrippt"
          else
            tools_strip=""
          fi
          tools_mib=$(( ${tools_kib:-0} / 1024 ))

          # Der Text steht ohne Ausdrücke in der Datei, damit nichts doppelt
          # ausgewertet wird; die Platzhalter ersetzt `sed` danach.
          cat > release-text.md <<'TEXT'
          ## mcp-quiver @VERSION@

          Der Client `quiver` — ein Endpunkt für alle MCP-Werkzeuge des Geräts.
          Das Server-Abbild baut `abbild.yml` für denselben Tag.

          | Plattform | Dateien |
          |---|---|
          | macOS arm64 | `.dmg` mit `quiver.app` |
          | macOS x86_64 | `.dmg` mit `quiver.app` |
          | Windows x86_64 | `.msi` (je Benutzer) und portables `.zip` |
          | Linux x86_64 | `.deb`, `.rpm`, AppImage, `.tar.gz` |
          | Linux aarch64 | `.deb`, `.rpm`, AppImage, `.tar.gz` |

          ### Werkzeuge im Paket

          Mitgeliefert sind die Programme aus
          [`patimweb-labs/quiver-tools`](https://github.com/patimweb-labs/quiver-tools)
          **@TOOLS_VERSION@** (Commit `@TOOLS_COMMIT@`)@TOOLS_STRIP@,
          @TOOLS_ANZAHL@ Stück, zusammen etwa @TOOLS_MIB@ MiB je Paket.
          Ein Eintrag der Bibliothek nennt damit nur noch den Programmnamen
          (`quiver-devops`); der Client sucht ihn neben seinem eigenen Programm.

          ### Signiert

          macOS: **@MACOS@**. Windows: **unsigniert**.
          TEXT

          # Ab hier ein einziger Anhang: viele kleine `cat >>` auf dieselbe
          # Datei wären unübersichtlich.
          {
            if [ "$macos" = unsigniert ] || [ "$macos" = unbekannt ]; then
              cat <<'TEXT'

          Unsigniert heißt: Gatekeeper und SmartScreen fragen beim ersten Start
          nach einer Bestätigung. macOS: Rechtsklick → *Öffnen* oder
          *Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“*.
          Windows: *Weitere Informationen → Trotzdem ausführen*.
          TEXT
            fi

            echo
            echo "### Größen"
            echo
            cat groessen.md

            cat <<'TEXT'

          ### Prüfen

          ```bash
          sha256sum -c SHA256SUMS
          gh attestation verify <datei> --repo @REPOSITORY@
          ```
          TEXT
          } >> release-text.md

          sed -i \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@MACOS@|$macos|g" \
            -e "s|@REPOSITORY@|$REPOSITORY|g" \
            -e "s|@TOOLS_VERSION@|${tools_version:-unbekannt}|g" \
            -e "s|@TOOLS_COMMIT@|${tools_commit:-unbekannt}|g" \
            -e "s|@TOOLS_ANZAHL@|${tools_anzahl:-0}|g" \
            -e "s|@TOOLS_MIB@|$tools_mib|g" \
            -e "s|@TOOLS_STRIP@|$tools_strip|g" \
            release-text.md
          cat release-text.md

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Der Block unten steht unter einer Marke. So bleiben die Notizen von
          # release-please erhalten, und ein zweiter Lauf ersetzt den Block,
          # statt ihn zu verdoppeln.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > vorhanden.md
            sed '/<!-- quiver-pakete -->/,$d' vorhanden.md > release-notizen.md
            printf '\n%s\n' '<!-- quiver-pakete -->' >> release-notizen.md
            cat release-text.md >> release-notizen.md
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notizen.md
          else
            { printf '%s\n\n' '<!-- quiver-pakete -->'; cat release-text.md; } > release-notizen.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file release-notizen.md --verify-tag
          fi
          gh release upload "$TAG" release/* -R "$GITHUB_REPOSITORY" --clobber

  # Ein Tag, den `GITHUB_TOKEN` anlegt, löst `abbild.yml` nicht aus. Nach einem
  # von release-please erzeugten Release wird das Abbild deshalb hier
  # angestoßen; `workflow_dispatch` ist die eine Ausnahme, die auch mit
  # `GITHUB_TOKEN` einen Lauf startet. Bei einem Tag von Hand hat der Tag
  # `abbild.yml` bereits selbst ausgelöst.
  abbild:
    name: Server-Abbild anstoßen
    needs: [version, veroeffentlichen]
    if: "!cancelled() && needs.version.result == 'success' && needs.veroeffentlichen.result == 'success' && needs.version.outputs.selbst_erzeugt == 'ja'"
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Abbild-Workflow für den Tag starten
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run abbild.yml --ref "$TAG" -R "$GITHUB_REPOSITORY"
