name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lieferkette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Sicherheitslücken (auch eingestellte Kisten), Lizenzen, Herkunft
      # (nur crates.io), doppelte Krypto-Kisten: die Regeln stehen in
      # `deny.toml`, jede Ausnahme mit Grund und Weg im Baum.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
      # Die Verwaltung ist die zweite Hälfte der Lieferkette.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: admin
        run: npm audit --audit-level=high

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux-Pakete für eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Die beiden Browser-Prüfungen gegen den echten Server (Aufgabe 26,
      # Punkte 2 und 10). Chrome headless mit eigenem temporären Profil,
      # Loopback, temporärer Datenordner; kein echter Mandant.
      - run: npx playwright install --with-deps chromium
      - run: cargo build -p quiver-server
        working-directory: .
      - run: npm run pruefung
      - run: npm run pruefung:anmeldung
